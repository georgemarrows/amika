<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Amika — prototype</title>
<style>
  :root {
    --bg: #191919;
    --bg-2: #202020;
    --bg-3: #2a2a2a;
    --border: #2f2f2f;
    --text: #e8e8e8;
    --dim: #8a8a8a;
    --dimmer: #5a5a5a;
    --accent: #7aa7d9;
    --accent-2: #a48bd9;
    --srs: #c99a3a;
    --srs-bg: #3a2e18;
    --ok: #78b068;
    --warn: #c97a3a;
    --highlight: rgba(201, 154, 58, 0.28);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    height: 100vh;
    overflow: hidden;
  }
  .jp, .jp * { font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, sans-serif; }

  /* ====== Layout ====== */
  #app { display: flex; height: 100vh; }

  #sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
    overflow-y: auto;
  }
  #sidebar h3 {
    font-size: 11px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin: 18px 8px 6px; padding: 0;
  }
  #sidebar h3:first-child { margin-top: 0; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-radius: 5px; cursor: pointer;
    color: var(--text); font-size: 13px;
  }
  .nav-item:hover { background: var(--bg-3); }
  .nav-item .badge {
    background: var(--srs-bg); color: var(--srs);
    padding: 1px 6px; border-radius: 8px; font-size: 11px;
    font-weight: 600;
  }

  #logo {
    padding: 4px 8px 14px; color: var(--text);
    font-weight: 600; font-size: 15px;
  }
  #logo .dim { color: var(--dim); font-weight: 400; margin-left: 4px; }
  .kbd {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    padding: 2px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-3);
    color: var(--dim);
  }

  /* ====== Panes ====== */
  #panes {
    flex: 1;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
  }
  #panes::-webkit-scrollbar { height: 10px; }
  #panes::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  .pane {
    width: 520px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    background: var(--bg);
    min-width: 520px;
  }
  .pane.home { width: 560px; min-width: 560px; }
  .pane-head {
    display: flex; align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    background: var(--bg-2);
  }
  .pane-head .title { flex: 1; font-size: 13px; color: var(--dim); }
  .pane-head .title .pill {
    background: var(--bg-3); padding: 2px 7px; border-radius: 4px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--dim); margin-right: 8px;
  }
  .pane-head .close {
    cursor: pointer; color: var(--dimmer);
    padding: 2px 6px; border-radius: 4px;
    font-size: 16px; line-height: 1;
  }
  .pane-head .close:hover { color: var(--text); background: var(--bg-3); }
  .pane-body {
    flex: 1; overflow-y: auto;
    padding: 24px 32px 48px;
  }

  /* ====== Entity pages ====== */
  .hero {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 4px;
  }
  .hero .glyph { font-size: 48px; line-height: 1; letter-spacing: 2px; }
  .hero .reading { color: var(--dim); font-size: 18px; }
  .subtitle { color: var(--dim); font-size: 14px; margin-bottom: 20px; }

  .srs-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 6px;
    background: var(--bg-3); color: var(--dim);
    border: 1px solid var(--border);
    cursor: pointer; font-size: 12px;
    user-select: none;
  }
  .srs-btn:hover { color: var(--text); border-color: var(--dimmer); }
  .srs-btn.on {
    background: var(--srs-bg); color: var(--srs); border-color: var(--srs);
  }

  .prop-row {
    display: grid; grid-template-columns: 110px 1fr;
    gap: 8px; padding: 4px 0;
    font-size: 13px;
  }
  .prop-row .k { color: var(--dim); }
  .prop-row .v { color: var(--text); }

  .section {
    margin-top: 28px;
  }
  .section h4 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }

  .tag {
    display: inline-block;
    background: var(--bg-3); color: var(--text);
    padding: 2px 8px; border-radius: 4px;
    margin: 2px 4px 2px 0; font-size: 12px;
    cursor: pointer;
  }
  .tag:hover { background: #363636; }
  .tag.topic { background: rgba(91, 134, 189, 0.2); color: #8ebbe5; }

  .word-link, .kanji-link, .grammar-link, .text-link {
    cursor: pointer;
    border-radius: 3px;
    padding: 1px 2px;
    text-decoration: none;
    color: inherit;
    transition: background 60ms ease;
  }
  .word-link:hover { background: rgba(122, 167, 217, 0.18); }
  .kanji-link:hover { background: rgba(164, 139, 217, 0.18); }
  .grammar-link:hover { background: rgba(120, 176, 104, 0.15); }
  .word-link.srs-added { background: var(--highlight); }

  .prose { font-size: 16px; line-height: 1.9; }
  .prose .en { color: var(--dim); font-size: 14px; margin-top: 6px; }

  .backlinks {
    margin-top: 36px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .backlinks h4 { color: var(--dimmer); }
  .backlink {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; font-size: 13px;
    cursor: pointer; color: var(--dim);
  }
  .backlink:hover { color: var(--text); }
  .backlink .type {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--dimmer); width: 60px;
  }

  /* ====== Home ====== */
  .home-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .home-card:hover { border-color: var(--dimmer); }
  .home-card .h {
    font-size: 12px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 6px;
  }
  .home-card .big { font-size: 20px; margin-bottom: 4px; }
  .home-card .meta { font-size: 12px; color: var(--dim); }
  .home-card.review {
    background: linear-gradient(to right, var(--srs-bg), var(--bg-2) 60%);
    border-color: var(--srs);
  }
  .home-card.review .big { color: var(--srs); font-weight: 600; }

  .feed-item {
    display: flex; gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .feed-item:hover .feed-title { color: var(--accent); }
  .feed-item .icon {
    font-size: 18px; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-3); border-radius: 6px; flex-shrink: 0;
  }
  .feed-item .feed-title { font-weight: 500; }
  .feed-item .feed-meta { color: var(--dim); font-size: 12px; }

  /* ====== Command palette ====== */
  #palette-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 100;
  }
  #palette-backdrop.open { display: flex; justify-content: center; padding-top: 120px; }
  #palette {
    width: 560px; max-height: 60vh;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
  }
  #palette input {
    background: transparent; border: none; outline: none;
    color: var(--text); padding: 14px 18px; font-size: 15px;
    border-bottom: 1px solid var(--border);
  }
  #palette-results { overflow-y: auto; }
  .pal-result {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 18px; cursor: pointer;
  }
  .pal-result.active, .pal-result:hover { background: var(--bg-3); }
  .pal-result .glyph { font-size: 20px; width: 32px; text-align: center; }
  .pal-result .meta { color: var(--dim); font-size: 12px; }
  .pal-result .type {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--dimmer); margin-left: auto;
  }

  /* ====== Kanji damage style ====== */
  .kanji-meaning { font-size: 22px; color: var(--ok); margin: 8px 0 18px; }
  .components {
    display: flex; gap: 18px; margin: 16px 0 24px;
    flex-wrap: wrap;
  }
  .component {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 16px; min-width: 110px;
    text-align: center; cursor: pointer;
  }
  .component:hover { border-color: var(--dimmer); }
  .component .g { font-size: 30px; margin-bottom: 4px; }
  .component .lbl { color: var(--dim); font-size: 12px; }

  .mnemonic {
    background: var(--bg-2); padding: 12px 16px;
    border-radius: 6px; margin: 8px 0;
    font-size: 14px; line-height: 1.55;
    border-left: 3px solid var(--accent-2);
  }
  .mnemonic .key { color: var(--warn); text-transform: uppercase; font-weight: 600; }
  .mnemonic .mean { color: var(--ok); font-style: italic; }

  .stroke-order {
    display: flex; align-items: center; gap: 12px;
    padding: 16px; background: var(--bg-2);
    border-radius: 6px; margin: 16px 0;
  }
  .stroke-order .frame {
    width: 64px; height: 64px;
    background: #fff; color: #111;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
    position: relative;
  }
  .stroke-order .frame .num {
    position: absolute; top: 2px; left: 4px;
    font-size: 11px; color: var(--accent);
  }

  /* ====== Confusable ====== */
  .confusable-row {
    display: flex; gap: 14px; align-items: stretch;
    margin: 10px 0 4px;
  }
  .confusable-card {
    flex: 1; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 18px; text-align: center; cursor: pointer;
  }
  .confusable-card:hover { border-color: var(--accent-2); }
  .confusable-card .g { font-size: 60px; line-height: 1; }
  .confusable-card .r { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .confusable-card .m { font-size: 14px; margin-top: 4px; }
  .diff-callout {
    font-size: 13px; color: var(--dim);
    margin: 4px 0 18px;
    padding: 8px 12px; background: var(--bg-2);
    border-left: 3px solid var(--warn);
    border-radius: 4px;
  }

  /* ====== Table ====== */
  table.dict {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  table.dict td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.dict td.r { color: var(--dim); width: 80px; }

  /* ====== SRS review ====== */
  .review-card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 40px 32px;
    text-align: center;
  }
  .review-card .prompt { font-size: 56px; margin-bottom: 28px; }
  .review-card .answer { font-size: 20px; color: var(--dim); }
  .review-card .actions {
    display: flex; gap: 10px; justify-content: center;
    margin-top: 28px;
  }
  .btn {
    padding: 8px 16px; border-radius: 6px; cursor: pointer;
    background: var(--bg-3); border: 1px solid var(--border);
    color: var(--text); font-size: 13px;
  }
  .btn:hover { border-color: var(--dimmer); }

  /* ====== Text with annotations ====== */
  .text-source {
    font-size: 13px; color: var(--dim); margin-bottom: 16px;
  }
  .prose .jp { cursor: text; }
  .prose .jp::selection { background: rgba(122, 167, 217, 0.4); }

  /* ====== Lookup popup ====== */
  #lookup-popup {
    position: fixed;
    background: var(--bg-2);
    border: 1px solid var(--dimmer);
    border-radius: 8px;
    padding: 14px 16px 12px;
    min-width: 260px; max-width: 340px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
  }
  #lookup-popup.show { display: block; }
  .lookup-word { font-size: 22px; margin-bottom: 2px; }
  .lookup-reading { color: var(--dim); font-size: 13px; }
  .lookup-meaning { margin: 8px 0 12px; font-size: 14px; line-height: 1.45; }
  .lookup-none {
    color: var(--dim); font-size: 13px; font-style: italic;
    margin: 6px 0 12px;
  }
  .lookup-actions { display: flex; gap: 6px; }
  .lookup-actions .btn {
    flex: 1; padding: 6px 10px; font-size: 12px; text-align: center;
  }
  .lookup-actions .btn.primary {
    background: var(--srs-bg); color: var(--srs); border-color: var(--srs);
  }
  .lookup-status {
    font-size: 11px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 8px;
  }
  .lookup-status.in-lib { color: var(--ok); }
</style>
</head>

// =====================================================
// Pane system
// =====================================================
const panesEl = document.getElementById("panes");

function openPane(key, afterPaneIndex = null) {
  // Remove any panes to the right of afterPaneIndex
  const children = Array.from(panesEl.children);
  if (afterPaneIndex !== null) {
    children.slice(afterPaneIndex + 1).forEach(c => c.remove());
  }
  // If this pane already open somewhere, just scroll to it
  const existing = [...panesEl.children].find(p => p.dataset.key === key);
  if (existing) {
    existing.scrollIntoView({ inline: "end", behavior: "smooth" });
    return;
  }
  const pane = renderPane(key);
  panesEl.appendChild(pane);
  setTimeout(() => pane.scrollIntoView({ inline: "end", behavior: "smooth" }), 10);
}

function renderPane(key) {
  const pane = document.createElement("div");
  pane.className = "pane";
  pane.dataset.key = key;

  const head = document.createElement("div");
  head.className = "pane-head";

  const body = document.createElement("div");
  body.className = "pane-body";

  let title = "";
  let pill = "";
  let paneClass = "";

  if (key === "home") {
    title = "Home"; pill = "home"; paneClass = "home";
    body.innerHTML = renderHome();
  } else if (key === "review") {
    title = "Today's review"; pill = "SRS";
    body.innerHTML = renderReview();
  } else if (key.startsWith("word:")) {
    const w = key.slice(5);
    title = w; pill = "word";
    body.innerHTML = renderWord(w);
  } else if (key.startsWith("kanji:")) {
    const k = key.slice(6);
    title = k; pill = "kanji";
    body.innerHTML = renderKanji(k);
  } else if (key.startsWith("grammar:")) {
    const g = key.slice(8);
    title = db.grammar[g].pattern; pill = "grammar";
    body.innerHTML = renderGrammar(g);
  } else if (key.startsWith("text-") || db.texts[key]) {
    title = db.texts[key].title; pill = db.texts[key].type;
    body.innerHTML = renderText(key);
  } else if (key === "list-words") {
    title = "All words"; pill = "index";
    body.innerHTML = renderWordList();
  } else if (key === "list-kanji") {
    title = "All kanji"; pill = "index";
    body.innerHTML = renderKanjiList();
  } else if (key === "list-grammar") {
    title = "All grammar"; pill = "index";
    body.innerHTML = renderGrammarList();
  } else if (key === "list-texts") {
    title = "All texts"; pill = "index";
    body.innerHTML = renderTextList();
  } else if (key === "confusable:実-美") {
    title = "実 vs 美"; pill = "compare";
    body.innerHTML = renderConfusable("実", "美");
  }

  head.innerHTML = `<div class="title"><span class="pill">${pill}</span><span class="jp">${title}</span></div><div class="close">×</div>`;
  head.querySelector(".close").onclick = () => pane.remove();

  if (paneClass) pane.classList.add(paneClass);
  pane.appendChild(head);
  pane.appendChild(body);

  // Bind clicks inside body
  body.addEventListener("click", (e) => {
    const t = e.target.closest("[data-link]");
    if (!t) return;
    e.preventDefault();
    const targetKey = t.dataset.link;
    const idx = [...panesEl.children].indexOf(pane);
    openPane(targetKey, idx);
  });
  body.addEventListener("click", (e) => {
    const t = e.target.closest("[data-srs]");
    if (!t) return;
    e.stopPropagation();
    const id = t.dataset.srs;
    if (srs.added.has(id)) srs.added.delete(id); else srs.added.add(id);
    document.getElementById("srs-count").textContent = srs.added.size;
    // refresh this pane
    const keepKey = pane.dataset.key;
    pane.remove();
    openPane(keepKey);
  });

  return pane;
}

function srsButton(id) {

function wordLink(w) {
  if (!db.words[w]) return `<span class="jp">${w}</span>`;
  const srsCls = srs.added.has(w) ? "srs-added" : "";
  return `<span class="word-link jp ${srsCls}" data-link="word:${w}">${w}</span>`;
}
function kanjiLink(k) {
  if (!db.kanji[k]) return `<span class="jp">${k}</span>`;
  return `<span class="kanji-link jp" data-link="kanji:${k}">${k}</span>`;
}

function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function annotateText(str) {
  // Drop the [..] seed hints — truth is db.words membership now.
  const clean = str.replace(/[\[\]]/g, "");
  const words = Object.keys(db.words).sort((a, b) => b.length - a.length);
  const matches = [];
  for (const w of words) {
    let idx = 0;
    while ((idx = clean.indexOf(w, idx)) !== -1) {
      const overlap = matches.some(m => idx < m.end && idx + w.length > m.start);
      if (!overlap) matches.push({ start: idx, end: idx + w.length, word: w });
      idx += w.length;
    }
  }
  matches.sort((a, b) => a.start - b.start);
  let html = ""; let pos = 0;
  for (const m of matches) {
    html += escapeHtml(clean.slice(pos, m.start));
    html += wordLink(m.word);
    pos = m.end;
  }
  html += escapeHtml(clean.slice(pos));
  return html;
}

    `<tr data-link="${id}" style="cursor:pointer">
      <td>${t.title}</td>
      <td class="r">${t.type}</td>
      <td>${t.source}</td>
    </tr>`).join("");
  return `<div class="hero"><div style="font-size:22px">Texts</div></div>
    <table class="dict"><tbody>${rows}</tbody></table>`;
}

function backlinkRow(type, title, key) {
  return `<div class="backlink" data-link="${key}"><span class="type">${type}</span>${title}</div>`;
}

// =====================================================
// Mini dictionary (prototype fallback — real dict later)
// =====================================================

  "毎日": { reading: "まいにち", meaning: "every day" },
  "働きすぎ": { reading: "はたらきすぎ", meaning: "overworking" },
  "働く": { reading: "はたらく", meaning: "to work" },
  "仕事": { reading: "しごと", meaning: "work, job" },
  "友達": { reading: "ともだち", meaning: "friend" },
  "自然": { reading: "しぜん", meaning: "nature, natural" },
  "勉強": { reading: "べんきょう", meaning: "study" },
  "日本": { reading: "にほん", meaning: "Japan" },
  "日本人": { reading: "にほんじん", meaning: "Japanese person" },
  "家": { reading: "いえ", meaning: "house, home" },

  "みなさん": { reading: "みなさん", meaning: "everyone" },

  "テーマ": { reading: "テーマ", meaning: "theme, topic" },
  "文化": { reading: "ぶんか", meaning: "culture" },
  "イメージ": { reading: "イメージ", meaning: "image, impression" },
  "例えば": { reading: "たとえば", meaning: "for example" },
  "時": { reading: "とき", meaning: "time, when" },
};

function lookup(text) {
  if (db.words[text]) return { reading: db.words[text].reading, meaning: db.words[text].meaning, inLib: true };
  if (miniDict[text]) return { ...miniDict[text], inLib: false };
  return null;
}

function refreshPanes() {
  const keys = [...panesEl.children].map(p => p.dataset.key);
  panesEl.innerHTML = "";
  keys.forEach(k => openPane(k));
}

const popup = document.getElementById("lookup-popup");

function showLookup(text, rect) {
  const entry = lookup(text);
  const inLib = !!db.words[text];
  const inSrs = srs.added.has(text);
  popup.innerHTML = `
    ${entry ? `<div class="lookup-status ${inLib ? 'in-lib' : ''}">${inLib ? 'in library' : entry ? 'dictionary' : ''}</div>` : ''}
    <div class="lookup-word jp">${text}</div>
    ${entry ? `
      <div class="lookup-reading jp">${entry.reading}</div>
      <div class="lookup-meaning">${entry.meaning}</div>
    ` : `
      <div class="lookup-none">Not in dictionary. Add with a note?</div>
    `}
    <div class="lookup-actions">
      ${inLib
        ? `<button class="btn" data-act="open">Open →</button>`
        : `<button class="btn primary" data-act="add-lib">+ Library</button>`}
      <button class="btn ${inSrs ? 'primary' : ''}" data-act="srs">${inSrs ? '✓ SRS' : '+ SRS'}</button>
    </div>
  `;
  const x = Math.min(rect.left, window.innerWidth - 360);
  const y = rect.bottom + 8;
  popup.style.left = x + "px";
  popup.style.top = y + "px";
  popup.classList.add("show");
  popup.dataset.word = text;
}
function hideLookup() { popup.classList.remove("show"); }

document.addEventListener("mouseup", (e) => {
  if (e.target.closest("#lookup-popup")) return;
  const sel = window.getSelection();
  const txt = sel.toString().trim();
  if (!txt) { return; }
  if (txt.length > 20) { hideLookup(); return; }
  if (!e.target.closest(".prose, .pane-body")) return;
  // Only Japanese-ish selections
  if (!/[\u3040-\u30ff\u4e00-\u9faf]/.test(txt)) return;
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  showLookup(txt, rect);
});
document.addEventListener("mousedown", (e) => {
  if (!e.target.closest("#lookup-popup") && !e.target.closest(".prose")) hideLookup();
});

popup.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const word = popup.dataset.word;
  const act = btn.dataset.act;
  if (act === "add-lib" || (act === "srs" && !db.words[word])) {
    const entry = lookup(word) || { reading: word, meaning: "(add meaning)" };
    db.words[word] = {
      reading: entry.reading,
      meaning: entry.meaning,
      kanji: [...word].filter(c => /[\u4e00-\u9faf]/.test(c)),
      appearsIn: [],
    };
  }
  if (act === "srs") {
    if (srs.added.has(word)) srs.added.delete(word); else srs.added.add(word);
    document.getElementById("srs-count").textContent = srs.added.size;
  } else if (act === "open") {
    hideLookup();
    openPane(`word:${word}`);
    return;
  }
  hideLookup();
  window.getSelection().removeAllRanges();
  refreshPanes();
});

// =====================================================
// Command palette
// =====================================================
const palette = document.getElementById("palette-backdrop");
const palInput = document.getElementById("palette-input");
const palResults = document.getElementById("palette-results");

function openPalette() { palette.classList.add("open"); palInput.value = ""; palInput.focus(); renderPalette(""); }
function closePalette() { palette.classList.remove("open"); }

function renderPalette(q) {
  const lower = q.toLowerCase();
  const items = [];
  for (const [id, w] of Object.entries(db.words)) {
    const score = matchScore(q, [id, w.reading, w.meaning]);
    if (score > 0) items.push({ key: `word:${id}`, glyph: id, label: id, meta: `${w.reading} · ${w.meaning}`, type: "word", score });
  }
  for (const [id, k] of Object.entries(db.kanji)) {
    const score = matchScore(q, [id, k.reading, k.meaning, k.on, k.kun]);
    if (score > 0) items.push({ key: `kanji:${id}`, glyph: id, label: id, meta: `${k.reading} · ${k.meaning}`, type: "kanji", score });
  }
  for (const [id, g] of Object.entries(db.grammar)) {
    const score = matchScore(q, [id, g.pattern, g.meaning, g.topic]);
    if (score > 0) items.push({ key: `grammar:${id}`, glyph: "文", label: g.pattern, meta: g.meaning, type: "grammar", score });
  }
  for (const [id, t] of Object.entries(db.texts)) {
    const score = matchScore(q, [t.title, t.source, t.type]);
    if (score > 0) items.push({ key: id, glyph: t.type === "podcast" ? "🎧" : t.type === "book" ? "📖" : "📝", label: t.title, meta: t.source, type: t.type, score });
  }
  items.sort((a, b) => b.score - a.score);
  palResults.innerHTML = items.slice(0, 12).map((it, i) =>
    `<div class="pal-result ${i===0?'active':''}" data-link="${it.key}">
      <div class="glyph jp">${it.glyph}</div>
      <div>
        <div class="jp" style="font-weight:500">${it.label}</div>
        <div class="meta">${it.meta}</div>
      </div>
      <div class="type">${it.type}</div>
    </div>`).join("") || `<div style="padding:18px;color:var(--dim);text-align:center">No results</div>`;
}

function matchScore(q, fields) {
  if (!q) return 1;
  const lower = q.toLowerCase();
  let s = 0;
  for (const f of fields) {
    if (!f) continue;
    const l = f.toLowerCase();
    if (l === lower) s += 100;
    else if (l.startsWith(lower)) s += 30;
    else if (l.includes(lower)) s += 10;
    if (f.includes(q)) s += 20; // kanji match
  }
  return s;
}

palInput.addEventListener("input", () => renderPalette(palInput.value));
palResults.addEventListener("click", (e) => {
  const t = e.target.closest(".pal-result");
  if (!t) return;
  closePalette();
  openPane(t.dataset.link);
});
palInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const first = palResults.querySelector(".pal-result");
    if (first) { closePalette(); openPane(first.dataset.link); }
  } else if (e.key === "Escape") closePalette();
});
palette.addEventListener("click", (e) => { if (e.target === palette) closePalette(); });

// =====================================================
// Global hotkeys + sidebar
// =====================================================
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); openPalette(); }
  if (e.key === "Escape" && !palette.classList.contains("open")) {
    // close rightmost pane
    const last = panesEl.lastElementChild;
    if (last && panesEl.children.length > 1) last.remove();
  }
});

document.querySelectorAll("#sidebar [data-open]").forEach(el => {
  el.addEventListener("click", () => {
    // clear all panes and open fresh
    panesEl.innerHTML = "";
    openPane(el.dataset.open);
  });
});
document.querySelectorAll("#sidebar [data-open-cmdk]").forEach(el => {
  el.addEventListener("click", openPalette);
});

// =====================================================
// Boot
// =====================================================
openPane("home");
document.getElementById("srs-count").textContent = srs.added.size;
</script>
